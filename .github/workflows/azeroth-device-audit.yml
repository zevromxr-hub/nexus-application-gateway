name: NEXUS Azeroth Companion — Advisory Device Audit
on:
  pull_request:
    paths:
      - 'azeroth-companion/**'
      - 'hub/index.html'
      - '.github/workflows/azeroth-device-audit.yml'
  push:
    branches: [main]
    paths:
      - 'azeroth-companion/**'
      - 'hub/index.html'
      - '.github/workflows/azeroth-device-audit.yml'
permissions:
  contents: read
jobs:
  browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test runtime
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium webkit
      - name: Test local Azeroth website on desktop and phone browsers
        id: browser
        continue-on-error: true
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/azeroth-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          node azeroth-companion/tests/world-atlas-cartography-v18.browser.mjs
          node azeroth-companion/tests/adventure-operations-v17.browser.mjs
          node azeroth-companion/tests/adventure-intelligence-v16.5.browser.mjs
          node azeroth-companion/tests/living-world-engine-v16.browser.mjs
          node azeroth-companion/tests/character-nexus-v15.browser.mjs
          node azeroth-companion/tests/citadel-entry-v91.browser.mjs
          node azeroth-companion/tests/studio-art-v92.browser.mjs
          node azeroth-companion/tests/luminous-glass-v93.browser.mjs
          node azeroth-companion/tests/living-entry-v9.browser.mjs
          node azeroth-companion/tests/device-audit.browser.mjs
          node azeroth-companion/tests/startup-audit.browser.mjs
          node azeroth-companion/tests/experience-stability.browser.mjs
          node azeroth-companion/tests/sovereign-command-v5.browser.mjs
          node azeroth-companion/tests/talent-planner-v51.browser.mjs
          node azeroth-companion/tests/sovereign-v8.browser.mjs
          node azeroth-companion/tests/living-azeroth-v9.browser.mjs
      - name: Upload screenshots if a browser check failed
        if: always() && steps.browser.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: azeroth-device-audit-screenshots
          path: test-results/azeroth-device-audit/
          if-no-files-found: ignore

      - name: Record pending device acceptance
        if: always()
        env:
          BROWSER: ${{ steps.browser.outcome }}
        run: |
          {
            echo "## NEXUS | Azeroth — advisory desktop/iPhone audit"
            echo "Browser test outcome: **$BROWSER**."
            echo "Release approval belongs to the project owner, not this test."
            echo "Failed browser checks are genuine pending findings; inspect logs/screenshots before marking them verified."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$BROWSER" != "success" ]; then
            echo "::warning title=Device test pending::Browser audit returned $BROWSER; release is not automatically blocked."
          fi
