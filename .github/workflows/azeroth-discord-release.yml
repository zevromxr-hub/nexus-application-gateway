name: NEXUS Azeroth Companion — Discord Release Announcer
on:
  push:
    branches: [main]
    paths:
      - 'azeroth-companion/releases/v*.json'
  workflow_dispatch:
    inputs:
      mode:
        description: Owner-controlled preview, release or explicit Pages timing override
        type: choice
        required: true
        default: dry-run
        options: [dry-run, send-current, send-owner-approved]
permissions:
  contents: write
concurrency:
  group: azeroth-release-announcer
  cancel-in-progress: false
jobs:
  announce:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm owner approval, disclosure and Discord payload integrity
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {metadata, payload} from './azeroth-companion/scripts/announce-release.mjs';
          const {v, release} = await metadata();
          const body = payload(v, release);
          assert.match(v.version, /^\d+\.\d+\.\d+$/);
          assert.equal(release.owner_approved, true, 'Only owner-approved release manifests may announce');
          assert.ok(['pending','partial','complete'].includes(release.tester_status));
          assert.equal(body.embeds?.[0]?.title, 'NEXUS | AZEROTH COMPANION v' + v.version);
          assert.ok(Array.isArray(body.embeds?.[0]?.fields));
          assert.ok(body.embeds[0].fields.every(f => String(f.value).length <= 1024));
          assert.deepEqual(body.allowed_mentions?.parse, []);
          console.log('Azeroth Discord release payload valid for v' + v.version);
          NODE
      - name: Print safe release diagnostics
        run: |
          echo "Trigger: ${{ github.event_name }}"
          echo "Release SHA: ${{ github.sha }}"
          echo "Webhook configured: ${{ secrets.DISCORD_RELEASE_WEBHOOK != '' }}"
          echo "Owner approval is distinct from tester verification; only confirmed Discord IDs count as delivery."
          echo "To bypass Pages deployment timing intentionally, choose send-owner-approved from workflow_dispatch."
      - name: Announce published Azeroth release
        env:
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          ANNOUNCEMENT_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'send-on-release' }}
        run: node azeroth-companion/scripts/announce-release.mjs "$ANNOUNCEMENT_MODE"
