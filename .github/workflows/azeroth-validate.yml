name: NEXUS Azeroth Companion — Advisory Validation
on:
  push:
    branches: [main]
    paths:
      - 'azeroth-companion/**'
      - 'index.html'
      - 'hub/index.html'
      - '.github/workflows/azeroth-validate.yml'
  pull_request:
    paths:
      - 'azeroth-companion/**'
      - 'index.html'
      - 'hub/index.html'
      - '.github/workflows/azeroth-validate.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Azeroth Companion and versioned release metadata
        id: source
        continue-on-error: true
        run: node azeroth-companion/tests/validate.mjs
      - name: Verify ZevArchives frontend compatibility only
        id: handoff
        continue-on-error: true
        run: node azeroth-companion/tests/zevarchives-frontend-handoff.test.mjs
      - name: Validate iOS Home Screen app shell across Companion pages
        id: ios
        continue-on-error: true
        run: node azeroth-companion/tests/ios-standalone-shell.test.mjs
      - name: Verify NEXUS Discord social preview cards
        id: social
        continue-on-error: true
        run: node azeroth-companion/tests/social-preview.test.mjs

      - name: Test v14 Build Architect source graph and integrity
        id: architect
        continue-on-error: true
        run: node azeroth-companion/tests/talent-build-architect-v14.test.mjs
      - name: Test v15 Character Nexus public research and package safety
        id: character
        continue-on-error: true
        run: node azeroth-companion/tests/character-nexus-v15.test.mjs
      - name: Validate v16 World Engine curated source and mission isolation
        id: world
        continue-on-error: true
        run: node azeroth-companion/tests/living-world-engine-v16.test.mjs
      - name: Test v16.5 Expedition Intelligence source and safe local records
        id: expedition
        continue-on-error: true
        run: node azeroth-companion/tests/adventure-intelligence-v16.5.test.mjs
      - name: Validate v17 Sovereign Adventure Operations and legacy isolation
        id: operations
        continue-on-error: true
        run: node azeroth-companion/tests/adventure-operations-v17.test.mjs
      - name: Test v18 Cartography Overdrive source, icons and mission privacy
        id: cartography
        continue-on-error: true
        run: node azeroth-companion/tests/world-atlas-cartography-v18.test.mjs
      - name: Test v18.1 Atlas Route Architect and source isolation
        id: routes
        continue-on-error: true
        run: node azeroth-companion/tests/world-atlas-routes-v18.1.test.mjs
      - name: Guard preserved Sovereign Command shell against newer releases
        id: legacy_shell
        continue-on-error: true
        run: node azeroth-companion/tests/sovereign-command-v5.test.mjs
      - name: Guard native Talent Forge planning, save format and live version badge
        id: legacy_forge
        continue-on-error: true
        run: node azeroth-companion/tests/talent-planner-v51.test.mjs
      - name: Record truthful non-blocking acceptance findings
        if: always()
        env:
          SOURCE: ${{ steps.source.outcome }}
          HANDOFF: ${{ steps.handoff.outcome }}
          IOS: ${{ steps.ios.outcome }}
          SOCIAL: ${{ steps.social.outcome }}
          ARCHITECT: ${{ steps.architect.outcome }}
          CHARACTER: ${{ steps.character.outcome }}
          WORLD: ${{ steps.world.outcome }}
          EXPEDITION: ${{ steps.expedition.outcome }}
          LEGACY_SHELL: ${{ steps.legacy_shell.outcome }}
          LEGACY_FORGE: ${{ steps.legacy_forge.outcome }}
          OPERATIONS: ${{ steps.operations.outcome }}
          CARTOGRAPHY: ${{ steps.cartography.outcome }}
          ROUTES: ${{ steps.routes.outcome }}
        run: |
          {
            echo "## NEXUS | Azeroth — advisory source checks"
            echo "Owner controls release approval. These are diagnostic outcomes, not release gates."
            echo ""
            echo "| Test | Actual outcome |"
            echo "| --- | --- |"
            echo "| Version / source regression | $SOURCE |"
            echo "| Frontend handoff | $HANDOFF |"
            echo "| iPhone Home Screen shell | $IOS |"
            echo "| Discord social preview | $SOCIAL |"
            echo "| v14 Build Architect source graph | $ARCHITECT |"
            echo "| v15 Character Nexus and package safety | $CHARACTER |"
            echo "| v16 Living World Engine and local mission safety | $WORLD |"
            echo "| v16.5 Expedition Intelligence and prep storage safety | $EXPEDITION |"
            echo "| v17 Sovereign Adventure Operations and session safety | $OPERATIONS |"
            echo "| v18 Atlas original cartography and preserved mission records | $CARTOGRAPHY |"
            echo "| v18.1 Atlas visual routes and isolated saved itinerary safety | $ROUTES |"
            echo "| Preserved v5 Sovereign Command shell | $LEGACY_SHELL |"
            echo "| Preserved native v5.1 Talent Forge and current version badge | $LEGACY_FORGE |"
            echo ""
            echo "Any failure remains a real, unresolved finding for later testers, not an automatic pass."
          } >> "$GITHUB_STEP_SUMMARY"
          for state in "$SOURCE" "$HANDOFF" "$IOS" "$SOCIAL" "$ARCHITECT" "$CHARACTER" "$WORLD" "$EXPEDITION" "$OPERATIONS" "$CARTOGRAPHY" "$ROUTES" "$LEGACY_SHELL" "$LEGACY_FORGE"; do
            if [ "$state" != "success" ]; then
              echo "::warning title=Azeroth advisory test::Outcome $state — review later; owner release is not blocked."
            fi
          done
