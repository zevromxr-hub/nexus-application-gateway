name: Sovereign Survival — Genesis Validation
on:
  push:
    paths:
      - 'sovereign-survival/**'
      - '.github/workflows/sovereign-survival.yml'
  pull_request:
    paths:
      - 'sovereign-survival/**'
      - '.github/workflows/sovereign-survival.yml'
permissions:
  contents: read
jobs:
  logic-and-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify arcade combat engine, progression and PWA safety
        run: node sovereign-survival/tests/validate.mjs
  browser-play:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium and iPhone WebKit
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium webkit
      - name: Test real game launch, player controls and local records
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/sovereign-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          node sovereign-survival/tests/browser.mjs
